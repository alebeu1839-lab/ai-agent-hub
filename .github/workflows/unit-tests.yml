name: AI Agent Hub unit tests
on:
  push:
    branches: [design/agent-operations-v1]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run stdlib unit tests
        run: python -m unittest discover -s tests -v
